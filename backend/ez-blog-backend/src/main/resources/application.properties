# ---------- Server ----------
# Behind a reverse proxy (Nginx / load balancer): lets Spring see the original HTTPS request.
# Needed for HSTS and OAuth redirect URIs.
server.forward-headers-strategy=framework

# ---------- Database ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Never "update" in production; use Flyway/Liquibase for schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JSON ----------
spring.jackson.default-property-inclusion=non_null

# ---------- OAuth2 (Google) ----------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ---------- JWT ----------
# Base64 value, at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ezblog
app.jwt.access-minutes=15
app.jwt.refresh-days=7

# ---------- Frontend / CORS ----------
# Local development: http://localhost:3000
app.frontend-url=${FRONTEND_URL}
# Comma-separated list of exact origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---------- Email verification ----------
app.verification.ttl-minutes=60
# Must be an address your SMTP provider allows you to send from.
app.mail.from=${MAIL_FROM}

# ---------- Mail (SMTP) ----------
spring.mail.host=${MAIL_HOST}
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000