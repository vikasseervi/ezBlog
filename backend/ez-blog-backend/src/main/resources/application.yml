spring:
  datasource:
    url: jdbc:h2:mem:ezBlog
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    headers:
      frame-options:
        mode: SAMEORIGIN
  mvc:
    dispatch-options-request: true
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true

server:
  port: 8080
  address: 0.0.0.0

ezBlog:
  app:
    jwtSecret: blogPlatformSecretKey123456789012345678901234567890123456789012345678901234567890
    jwtExpirationMs: 86400000

logging:
  level:
    com.ezBlog.backend: DEBUG
    org.springframework.security: DEBUG
