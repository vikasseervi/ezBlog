spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ezblog
    username: ezblog
    password: root

  flyway:
    # Real migrations + sample data (dev only)
    locations: classpath:db/migration,classpath:db/dev
    # Lets you add V2, V3... after the V1000 seed has already run on your dev database
    out-of-order: true

  mail:
    # Local mail catcher (Mailpit): no login, no TLS
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  security:
    oauth2:
      client:
        registration:
          google:
            # Defaults let the app start without Google set up; Google login just won't work
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}

  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true

server:
  forward-headers-strategy: none     # no proxy on your laptop

app:
  jwt:
    # DEV ONLY. Never reuse this in production, because it's committed to the repo.
    secret: GkhkjXd1P0Z0gd/6kRJi9PUJWhwUvj21zZXCqt33gayiBRhhYMzVyHM10tbMRYvh
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
  mail:
    from: no-reply@ezblog.local

logging:
  level:
    com.ezBlog.backend: DEBUG
    org.springframework.security: DEBUG